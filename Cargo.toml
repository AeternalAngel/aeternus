[package]
name = "aeternus"
description = "Emulador de terminal em Rust"
license = "MIT"
repository = "https://github.com/AeternalAngel/aeternus"
version = "1.4.0"
edition = "2021"

[dependencies]
portable-pty = "0.8"
winit = "0.30"
wgpu = "22"
cosmic-text = "0.12"
bytemuck = { version = "1", features = ["derive"] }
unicode-width = "0.1"
pollster = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"

[target.'cfg(unix)'.dependencies]
arboard = { version = "3.4", default-features = false, features = ["wayland-data-control"] }

[[bin]]
name = "aet"
path = "src/bin/aet.rs"

[profile.release]
opt-level = 2
