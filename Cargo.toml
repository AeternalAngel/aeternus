[package]
name = "aeternus"
description = "Emulador de terminal em Rust"
license = "MIT"
repository = "https://github.com/AeternalAngel/aeternus"
version = "0.1.0"
edition = "2021"

[dependencies]
nix = { version = "0.29", features = ["term", "ioctl"] }
winit = "0.30"
wgpu = "22"
cosmic-text = "0.12"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.3"
arboard = { version = "3.4", default-features = false, features = ["wayland-data-control"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
