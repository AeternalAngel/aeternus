name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    container: debian:12   # glibc 2.36
    steps:
      - name: Dependências
        run: |
          apt-get update
          apt-get install -y curl ca-certificates git build-essential pkg-config \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: actions/checkout@v4
      - name: Instalar Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Conferir tag x Cargo.toml
        run: |
          TAG=${GITHUB_REF_NAME#v}
          CARGO=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "$TAG" = "$CARGO" ] || { echo "Tag $TAG != Cargo.toml $CARGO"; exit 1; }
      - name: Compilar e empacotar
        run: |
          cargo build --release
          V=${GITHUB_REF_NAME#v}
          S=${V%.0}
          mkdir -p dist
          tar czf "dist/aeternus-$S-linux-x86_64.tar.gz" \
            -C target/release aeternus aet -C ../.. LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums e nome curto
        id: ver
        run: |
          cd dist && sha256sum * > SHA256SUMS
          V=${GITHUB_REF_NAME#v}
          echo "short=${V%.0}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: Aeternus ${{ steps.ver.outputs.short }}
          generate_release_notes: true
          files: dist/*
