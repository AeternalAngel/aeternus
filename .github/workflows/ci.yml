name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: ./target/release/aeternus --version && ./target/release/aet --version

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install programs
        run: sudo apt-get update && sudo apt-get install -y vttest tmux vim zsh fish dash less htop ncurses-bin
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --test compat
        env:
          AETERNUS_COMPAT_REQUIRE: "1"

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream shellcheck groff-base
      - run: desktop-file-validate packaging/io.github.AeternalAngel.Aeternus.desktop
      - run: appstreamcli validate --no-net packaging/io.github.AeternalAngel.Aeternus.metainfo.xml
      - run: shellcheck install.sh packaging/sync-version.sh packaging/aur/update.sh
      - run: sh packaging/sync-version.sh --check
      - name: Terminfo
        run: |
          tic -x -o "$RUNNER_TEMP/terminfo" packaging/terminfo/xterm-aeternus.terminfo
          TERMINFO="$RUNNER_TEMP/terminfo" infocmp -x xterm-aeternus | grep -q 'Smulx='
      - run: |
          for f in packaging/man/*.1; do groff -man -Tutf8 -ww "$f" > /dev/null; done
      - run: bash -n packaging/completions/aet.bash && bash -n packaging/completions/aeternus.bash
