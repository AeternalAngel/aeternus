[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; transitive via cosmic-text and winit, no safe upgrade yet" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
